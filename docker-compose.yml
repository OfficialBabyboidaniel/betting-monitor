version: '3.8'

services:
  betting-monitor:
    build: .
    container_name: rebel-betting-monitor
    restart: unless-stopped
    environment:
      - DISPLAY=:99
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    # Optional: Add health check
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Optional: Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'